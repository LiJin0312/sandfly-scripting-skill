name: Release skill zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build skill zip
        run: |
          cd skills
          zip -r ../sandfly-scripting.zip sandfly-scripting

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            sandfly-scripting.zip \
            --title "SandFly Scripting Skill $GITHUB_REF_NAME" \
            --generate-notes
